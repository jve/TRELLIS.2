name: Package and Push Helm Chart

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'helm/**'
      - '.github/workflows/helm-release.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'helm/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Chart version override'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  CHART_NAME: trellis2

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Lint Helm chart
        run: helm lint helm/trellis2

      - name: Template Helm chart (validate)
        run: |
          helm template trellis2 helm/trellis2 > /dev/null
          helm template trellis2 helm/trellis2 -f helm/trellis2/values-dev.yaml > /dev/null
          helm template trellis2 helm/trellis2 -f helm/trellis2/values-production.yaml > /dev/null

  package:
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    outputs:
      chart_version: ${{ steps.version.outputs.chart_version }}
      app_version: ${{ steps.version.outputs.app_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.0

      - name: Determine versions
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            # Use manual version input
            CHART_VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Extract version from tag (v1.0.0 -> 1.0.0)
            CHART_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Development version: 0.0.0-dev+sha
            SHORT_SHA=$(git rev-parse --short HEAD)
            CHART_VERSION="0.0.0-dev.${SHORT_SHA}"
          fi

          # App version follows chart version for releases, or uses git SHA
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            APP_VERSION="dev-$(git rev-parse --short HEAD)"
          fi

          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "Chart version: ${CHART_VERSION}"
          echo "App version: ${APP_VERSION}"

      - name: Update Chart.yaml versions
        run: |
          sed -i "s/^version:.*/version: ${{ steps.version.outputs.chart_version }}/" helm/trellis2/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ steps.version.outputs.app_version }}\"/" helm/trellis2/Chart.yaml
          cat helm/trellis2/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package helm/trellis2 --destination .helm-packages

      - name: Log in to OCI Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Push Helm chart to OCI Registry
        run: |
          helm push .helm-packages/${{ env.CHART_NAME }}-${{ steps.version.outputs.chart_version }}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Upload chart artifact
        uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: .helm-packages/*.tgz

  summary:
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name != 'pull_request'
    steps:
      - name: Print installation instructions
        run: |
          echo "## Helm Chart Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Chart version: \`${{ needs.package.outputs.chart_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "App version: \`${{ needs.package.outputs.app_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Login to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "helm registry login ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Install the chart" >> $GITHUB_STEP_SUMMARY
          echo "helm install trellis2 oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/${{ env.CHART_NAME }} --version ${{ needs.package.outputs.chart_version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
