{{- if and .Values.huggingface.token (not .Values.huggingface.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trellis2.huggingfaceSecretName" . }}
  labels:
    {{- include "trellis2.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.huggingface.existingSecretKey }}: {{ .Values.huggingface.token | b64enc }}
{{- end }}
---
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trellis2.secretName" . }}
  labels:
    {{- include "trellis2.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
{{- end }}
